# ════════════════════════════════════════════════════════════════════
#  فحص الجودة بعد كل رفع — لا ينشر شيئًا
#  --------------------------------------------------------------------
#  لماذا تغيّر هذا الملف؟ لأن النشر عبر Actions أضاف طبقة تفشل لأسباب
#  لا علاقة لها بالأداة (تثبيت اعتماديات، صلاحيات Pages، ذاكرة مؤقتة)،
#  وكل فشل فيها كان يعني: الموقع لا يتحدّث والسبب غامض.
#
#  الترتيب الجديد أبسط وأمتن:
#    • النشر يتم من الفرع مباشرة (Settings ← Pages ← Deploy from a branch)
#      لأن المستودع يحتوي أصلًا على الملفات المبنية جاهزة.
#    • وهذا العامل يبقى للفحص وحده: يشغّل الاختبارات ويتأكد أن الملفات
#      المبنية مطابقة للمصدر. فشله لا يعطّل الموقع — يخبرك فقط.
# ════════════════════════════════════════════════════════════════════
name: فحص الاختبارات

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # بلا cache: npm — أكثر أسباب فشل الفحص شيوعًا وأقلّها فائدة هنا
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تثبيت الاعتماديات
        run: npm install --no-audit --no-fund

      - name: تشغيل كل الاختبارات
        run: npm run test:all

      - name: التأكد أن الملفات المبنية مطابقة للمصدر
        # لو نسيت رفع assets بعد تعديل src، يظهر هنا بدل أن يظهر
        # كـ«رفعت ولم يتغيّر شيء» بعد يومين
        run: |
          cp assets/main.js /tmp/main_before.js
          npm run build
          if ! cmp -s /tmp/main_before.js assets/main.js; then
            echo "::warning::الملفات المبنية في المستودع أقدم من المصدر — أعد رفع مجلد assets"
          else
            echo "الملفات المبنية مطابقة للمصدر ✅"
          fi
